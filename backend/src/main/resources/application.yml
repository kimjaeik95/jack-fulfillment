# 공통 설정 — 프로파일과 무관하게 적용된다.
spring:
  application:
    name: fulfillment
  profiles:
    # 별도 지정이 없으면 로컬(H2)로 뜬다.
    default: local
  servlet:
    multipart:
      # 대량 등록 파일 (COM-PG-010). 1만 행 CSV 가 대략 1~2MB 라 여유를 둔다.
      # 기본값 1MB 로는 수천 행에서 막힌다.
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  servlet:
    # 프론트(Vite)의 프록시 대상과 맞춘다. 예) fetch('/api/users')
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
