# 공통 설정 — 프로파일과 무관하게 적용된다.
spring:
  application:
    name: fulfillment
  profiles:
    # 별도 지정이 없으면 로컬 프로파일로 뜬다 — 개발자 PC 의 PostgreSQL 이다.
    # H2 를 쓰지 않는다. 스키마가 PostgreSQL 전용이라(GENERATED 컬럼 · 부분
    # 유니크 인덱스 · IS NOT DISTINCT FROM) 다른 DB 에서는 마이그레이션이
    # 돌지 않는다.
    #
    # 그래서 DB_PASSWORD 가 없으면 뜨지 않는다. 테스트는 test 프로파일로
    # 돌려 DB 없이 컨텍스트만 확인한다.
    default: local
  servlet:
    multipart:
      # 대량 등록 파일 (COM-PG-010). 1만 행 CSV 가 대략 1~2MB 라 여유를 둔다.
      # 기본값 1MB 로는 수천 행에서 막힌다.
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  servlet:
    # 프론트(Vite)의 프록시 대상과 맞춘다. 예) fetch('/api/users')
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ============================================================================
# 보안 설정 (COM-PG-001)
# ============================================================================
app:
  security:
    # 계정을 만들 때 넣는 초기 비밀번호. 관리자가 계정마다 정하지 않는다.
    # 첫 로그인에서 반드시 바꾸게 되어 있다 (must_change_password).
    #
    # 운영에서는 반드시 덮는다. 이 값은 공개 저장소에 적혀 있어, 그대로 두면
    # 새로 만든 계정은 아이디만 알면 열린다.
    #   dev/prod:  APP_SECURITY_INITIAL_PASSWORD 환경변수 또는 프로파일 설정
    initial-password: ${APP_SECURITY_INITIAL_PASSWORD:wms1234!}

    # 90일 동안 로그인하지 않으면 휴면 처리한다. 쓰지 않는 계정은 살아
    # 있는 것이 아니라 잊힌 것이고, 잊힌 계정으로 누가 들어와도 아무도
    # 이상하게 여기지 않는다.
    dormant-after: 90d

    # 로그인 실패 잠금 — 스스로 풀리는 단계를 앞에 둔다.
    # 손가락이 미끄러진 사람은 1단계에서 끝나고, 집요하게 두드리는 쪽만
    # 관리자까지 간다.
    lockout:
      temp-after: 5
      temp-duration: 5m
      long-after: 10
      long-duration: 1h
      permanent-after: 15
