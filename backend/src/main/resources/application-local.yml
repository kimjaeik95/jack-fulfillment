# 로컬 개발 프로파일 — 개발자 PC 의 PostgreSQL.
#
# dev 프로파일과 다른 점은 두 가지뿐이다.
#   1) db/demo 마이그레이션(데모 사용자 12명)을 함께 적용한다
#   2) 실행 SQL 을 콘솔에 출력한다
#
# 사전 준비 (한 번만) — postgres 계정으로 실행
#   CREATE USER fulfillment WITH PASSWORD '비밀번호';
#   CREATE DATABASE fulfillment OWNER fulfillment ENCODING 'UTF8';
#
# 실행
#   $env:DB_PASSWORD = "비밀번호"
#   gradlew bootRun
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fulfillment}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:fulfillment}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000

  flyway:
    enabled: true
    # db/demo 는 로컬 전용. 데모 계정이 운영에 배포되지 않도록 프로파일로 분리한다.
    locations: classpath:db/migration,classpath:db/demo
    baseline-on-migrate: false
    validate-on-migrate: true
    # db/demo 를 V900 으로 번호매겨 뒤에 두었기 때문에, 이후 추가되는
    # 업무 마이그레이션(V4, V5 ...)은 항상 V900 보다 앞 번호가 된다.
    # 로컬에서만 순서 역전을 허용한다. dev/prod 는 db/demo 를 포함하지 않아
    # V1..Vn 이 순서대로 적용되므로 엄격한 순서 검증을 그대로 유지한다.
    out-of-order: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.fulfillment
  configuration:
    # user_name(DB) ↔ userName(Java) 자동 변환
    map-underscore-to-camel-case: true
    # null 컬럼도 setter 를 호출해 필드가 누락되지 않게 한다
    call-setters-on-nulls: true
    default-statement-timeout: 10

logging:
  level:
    # 실행되는 SQL 과 바인딩 파라미터를 콘솔에 출력
    com.fulfillment: debug
    org.mybatis: debug

# ============================================================================
# 배치
#
# 전부 기본이 꺼짐이다 (각 배치의 enabled:false). 개발 PC 에서 매분 도는
# 배치가 로그를 채우기 때문인데, 주문 흐름은 배치가 돌아야 이어진다 —
# 확정도 할당도 안 되면 주문이 접수 상태로 쌓인 채 아무 일도 안 일어난다.
# 그래서 주문 쪽 셋만 켠다.
#
#   자동확정      접수 + 미매핑 없음  →  확정
#   자동할당      확정                →  재고 잡기
#   미할당 재처리  결품                →  재고가 들어왔나 다시 보기
#
# 재고 대사(recon)와 휴면(dormant)은 새벽에 한 번 도는 것이라 개발 중에는
# 티가 안 난다. 필요할 때 켠다.
# ============================================================================
fulfillment:
  batch:
    autoConfirm:
      enabled: true
    autoAlloc:
      enabled: true
    allocRetry:
      enabled: true
