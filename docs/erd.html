const data = JSON.parse(document.getElementById('schema').textContent);
const $ = id => document.getElementById(id);
const escapeHTML = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('versionRange').textContent = data.versionRange;
const tableMap = new Map(data.tables.map(t => [t.name,t]));
let selected = '', zoom = .8, width = 1, height = 1, visible = [], positions = new Map();
$('stats').innerHTML = [[data.tables.length,'TABLES'],[data.tables.reduce((n,t)=>n+t.columns.length,0),'COLUMNS'],[data.relationships.length,'FOREIGN KEYS']].map(([n,l])=>`<div><b>${n}</b><span>${l}</span></div>`).join('');
data.groups.forEach((g,i)=>{const o=document.createElement('option');o.value=i;o.textContent=g.name;$('group').append(o)});
function neighbors(name){const set=new Set([name]);data.relationships.forEach(r=>{if(r.from===name)set.add(r.to);if(r.to===name)set.add(r.from)});return set}
function shownColumns(t){return $('allColumns').checked?t.columns:t.columns.filter(c=>c.pk||c.fk)}
function keys(c){return [c.pk?'PK':'',c.fk?'FK':'',c.unique?'UQ':''].filter(Boolean).join(' ')}
function render(){
  const query=$('search').value.trim().toLowerCase(),group=$('group').value,related=neighbors(selected);
  visible=data.tables.filter(t=>(group===''||t.group===Number(group))&&(!$('onlyRelated').checked||!selected||related.has(t.name))&&(!query||[t.name,t.comment,...t.columns.flatMap(c=>[c.name,c.comment])].join(' ').toLowerCase().includes(query)));
  $('empty').hidden=visible.length>0;positions=new Map();let lane=0;let cards='',nav='';height=100;
  data.groups.forEach((g,i)=>{
    const tables=g.tables.map(n=>tableMap.get('tb_'+n)).filter(t=>visible.includes(t));if(!tables.length)return;
    const x=40+lane*410;let y=65;
    cards+=`<div class="lane" style="left:${x}px;--color:${g.color}">${escapeHTML(g.name)}<small>${tables.length}</small></div>`;
    nav+=`<h2 style="color:${g.color}">${escapeHTML(g.name)} · ${tables.length}</h2>`;
    for(const t of tables){
      const cols=shownColumns(t);positions.set(t.name,{x,y,cols});
      cards+=`<article id="card-${t.name}" class="card" style="left:${x}px;top:${y}px;--color:${g.color}"><button data-table="${t.name}" aria-label="${t.name} 상세"><strong>${t.name}</strong><span class="description">${escapeHTML(t.comment||'설명 없음')}</span></button>${cols.map(c=>`<div class="row ${c.pk?'pk':''}" data-col="${c.name}" title="${escapeHTML(c.definition+' · '+c.comment)}"><span class="keys">${keys(c)}</span><span class="col">${c.name}${!c.nullable?'<span class="required"> *</span>':''}</span><span class="type">${escapeHTML(c.type)}</span></div>`).join('')}<div class="more">${t.columns.length}개 컬럼${cols.length<t.columns.length?' · 키 컬럼만 표시':''} · 클릭하여 상세 보기</div></article>`;
      nav+=`<button data-table="${t.name}" class="${selected===t.name?'active':''}">${t.name}<small>${escapeHTML(t.comment)}</small></button>`;
      y+=64+cols.length*25+28+45;
    }
    height=Math.max(height,y+30);lane++;
  });
  width=Math.max(400,lane*410+40);$('cards').innerHTML=cards;$('nav').innerHTML=nav;
  // Measure actual cards before routing edges, including font and header height.
  for(const [name,p] of positions){const el=$('card-'+name);p.h=el.offsetHeight;p.w=el.offsetWidth;}
  drawEdges();applyHighlight();applyZoom();
}
function drawEdges(){
  const svg=$('edges');svg.setAttribute('width',width);svg.setAttribute('height',height);
  let html='<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker><marker id="hotArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4f46e5"/></marker></defs>';
  data.relationships.forEach((r,i)=>{
    const a=positions.get(r.from),b=positions.get(r.to);if(!a||!b)return;
    const rowY=(name,p,col)=>{const el=$('card-'+name).querySelector('[data-col="'+col+'"]');return p.y+(el?el.offsetTop+el.offsetHeight/2:30)};
    const ay=rowY(r.from,a,r.fromColumns[0]),by=rowY(r.to,b,r.toColumns[0]);
    let ax,bx,d;
    if(a.x===b.x){ax=a.x+a.w;bx=b.x+b.w;const route=ax+22+(i%6)*8;d=`M${ax},${ay} C${route},${ay} ${route},${by} ${bx},${by}`;if(r.from===r.to)d=`M${ax},${ay} L${route},${ay} L${route},${by} L${bx},${by}`;}
    else {const forward=a.x<b.x;ax=forward?a.x+a.w:a.x;bx=forward?b.x:b.x+b.w;const bend=forward?35:-35;d=`M${ax},${ay} C${ax+bend},${ay} ${bx-bend},${by} ${bx},${by}`;}
    html+=`<path class="edge" data-from="${r.from}" data-to="${r.to}" d="${d}" marker-end="url(#arrow)"><title>${escapeHTML(r.from+'.'+r.fromColumns.join(',')+' → '+r.to+'.'+r.toColumns.join(',')+' · '+r.name)}</title></path>`;
  });svg.innerHTML=html;
}
function applyHighlight(){const related=neighbors(selected);document.querySelectorAll('.card').forEach(el=>{const name=el.id.slice(5);el.classList.toggle('selected',name===selected);el.classList.toggle('related',!!selected&&related.has(name));el.classList.toggle('dim',!!selected&&!related.has(name))});document.querySelectorAll('.edge').forEach(el=>{const hot=!!selected&&(el.dataset.from===selected||el.dataset.to===selected);el.classList.toggle('hot',hot);el.classList.toggle('muted',!!selected&&!hot);el.setAttribute('marker-end',hot?'url(#hotArrow)':'url(#arrow)')});const svg=$('edges');svg.querySelectorAll('.hot').forEach(el=>svg.append(el));}
function applyZoom(){ $('diagram').style.width=width+'px';$('diagram').style.height=height+'px';$('diagram').style.transform=`scale(${zoom})`;$('surface').style.width=width*zoom+'px';$('surface').style.height=height*zoom+'px';$('zoomLabel').textContent=Math.round(zoom*100)+'%'; }
function changeZoom(value){const v=$('viewport'),cx=(v.scrollLeft+v.clientWidth/2)/zoom,cy=(v.scrollTop+v.clientHeight/2)/zoom;zoom=Math.min(1.8,Math.max(.08,value));applyZoom();v.scrollLeft=cx*zoom-v.clientWidth/2;v.scrollTop=cy*zoom-v.clientHeight/2;}
function selectTable(name){
  selected=name;
  if(!visible.some(t=>t.name===name)){$('search').value='';$('group').value='';}
  render();showDetail();
  const p=positions.get(name);if(p){$('viewport').scrollTo({left:Math.max(0,p.x*zoom-35),top:Math.max(0,p.y*zoom-35),behavior:'smooth'})}
}
function showDetail(){
  const t=tableMap.get(selected);if(!t){$('detail').hidden=true;return}
  const rels=data.relationships.filter(r=>r.from===selected||r.to===selected);
  $('detail').hidden=false;
  $('detail').innerHTML=`<button class="close" id="closeDetail" aria-label="상세 닫기">×</button><div class="source">${escapeHTML(data.groups[t.group].name)}</div><h2>${t.name}</h2><p>${escapeHTML(t.comment)}</p><div class="source">최초 정의: ${escapeHTML(t.source)}</div><h3>전체 컬럼 · ${t.columns.length}</h3><table><thead><tr><th>컬럼 / 설명</th><th>타입 / NULL</th><th>키</th></tr></thead><tbody>${t.columns.map(c=>`<tr><td>${c.name}<small>${escapeHTML(c.comment)}</small><small title="${escapeHTML(c.definition)}">${escapeHTML(c.definition.replace(c.type,'').trim())}</small>${c.source!==t.source?`<small>추가: ${escapeHTML(c.source)}</small>`:''}</td><td>${escapeHTML(c.type)}<small>${c.nullable?'NULL 허용':'NOT NULL'}</small></td><td>${keys(c)}</td></tr>`).join('')}</tbody></table><h3>물리 FK 관계 · ${rels.length}</h3><p>FK에서 참조 키 방향으로 표시합니다. 코드값 등 FK가 없는 논리 관계는 추정하지 않습니다.</p>${rels.map(r=>`<button class="relation" data-table="${r.from===selected?r.to:r.from}">${escapeHTML(r.from+'.'+r.fromColumns.join(', '))}<br>→ ${escapeHTML(r.to+'.'+r.toColumns.join(', '))}<br><span class="source">${escapeHTML(r.name+' · '+r.rule)}</span></button>`).join('')||'<p>선언된 FK 관계가 없습니다.</p>'}<h3>제약조건 · ${t.constraints.length}</h3><p>UQ는 복합 UNIQUE의 구성원일 수 있습니다. 개별 컬럼의 유일성을 뜻하지 않습니다.</p>${t.constraints.map(c=>`<pre><b>${escapeHTML(c.name)}</b>\n${escapeHTML(c.sql)}</pre>`).join('')}<h3>인덱스 · ${t.indexes.length}</h3>${t.indexes.map(i=>`<pre><b>${escapeHTML(i.name)}</b> ${i.unique?'UNIQUE':''}\n${escapeHTML(i.sql)}</pre>`).join('')}<p class="source">${escapeHTML(data.source)}<br>DB 인증 미완료로 실제 적용 상태는 확인하지 않았습니다.</p>`;
  $('closeDetail').onclick=()=>{selected='';$('detail').hidden=true;render()};
}
document.addEventListener('click',e=>{const button=e.target.closest('[data-table]');if(button)selectTable(button.dataset.table)});
['search','group','allColumns','onlyRelated'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
$('plus').onclick=()=>changeZoom(zoom*1.2);$('minus').onclick=()=>changeZoom(zoom/1.2);
$('fit').onclick=()=>{changeZoom(Math.min(($('viewport').clientWidth-30)/width,($('viewport').clientHeight-30)/height));$('viewport').scrollTo(0,0)};
$('reset').onclick=()=>{selected='';zoom=.8;$('search').value='';$('group').value='';$('allColumns').checked=false;$('onlyRelated').checked=false;$('detail').hidden=true;render();$('viewport').scrollTo(0,0)};
$('viewport').addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();changeZoom(zoom*(e.deltaY<0?1.1:1/1.1))}},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('detail').hidden=true;selected='';render()}});
render();
</script>
</body>
</html>
