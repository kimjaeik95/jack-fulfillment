<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fulfillment · 업무별 시스템 구성도</title>
<style>
*{box-sizing:border-box}:root{font:14px 'Segoe UI','Malgun Gothic',sans-serif;color:#24334b;background:#f4f6fa}body{margin:0}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:#4f46e5;text-decoration:none}a:hover{text-decoration:underline}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #818cf8;outline-offset:2px}header{height:76px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:15px}header strong{font-size:19px;letter-spacing:-.6px}header small{display:block;color:#8591a5;margin-top:5px}header a{border:1px solid #dce1ea;border-radius:7px;padding:9px 13px;font-size:12px}.layout{display:flex;height:calc(100vh - 76px)}aside{width:300px;flex-shrink:0;background:#15223b;color:#d8e1f0;padding:20px 14px;overflow:auto}aside .caption{font-size:10px;color:#93a5c3;letter-spacing:2px;margin:5px 10px 16px}#search{width:100%;border:1px solid #40516e;background:#20314d;color:#fff;border-radius:7px;padding:10px 12px;margin-bottom:15px}#search::placeholder{color:#aab9d0}.tree-group{margin:5px 0}.tree-group summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}.tree-group summary:before{content:'▸';color:#93a5c3}.tree-group[open] summary:before{content:'▾'}.tree-group summary button{flex:1}.nav-button{border:0;background:transparent;color:inherit;text-align:left;display:block;width:100%;padding:10px 8px;border-radius:6px;font-size:12px}.nav-button:hover,.nav-button.active{background:#30476f;color:white}.nav-button small{font-size:10px;color:#9fb1ce}.screen-link{font-size:11px;padding:8px 10px 8px 29px}.nav-number{font-family:Consolas,monospace;color:#a5b4fc;margin-right:9px}.side-note{border-top:1px solid #34425b;margin:22px 8px;padding-top:15px;font-size:11px;line-height:1.8;color:#99abc7}main{flex:1;min-width:0;overflow:auto;padding:32px 38px 60px}.eyebrow{font-size:11px;letter-spacing:1.8px;color:#6366f1;font-weight:700}h1{font-size:30px;letter-spacing:-1px;margin:9px 0 12px}h2{font-size:18px;margin:28px 0 13px}h3{font-size:14px;margin:0 0 8px}.lead{font-size:13px;color:#6b7b91;line-height:1.9;max-width:900px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.badge{font-size:11px;background:#e8ecff;color:#4f46e5;padding:6px 10px;border-radius:5px}.badge.gray{background:#e8edf3;color:#64748b}.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0}.metric{padding:18px;background:white;border:1px solid #e2e8f0;border-radius:10px}.metric b{display:block;font-size:29px;color:#4338ca}.metric span{display:block;color:#6b7b91;font-size:11px;margin-top:5px}.overview-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.domain{background:white;border:1px solid #e0e6f0;border-radius:10px;padding:20px;text-align:left;color:inherit;min-height:165px}.domain:hover{border-color:#818cf8;box-shadow:0 4px 14px #3341550c}.domain .num{font:700 12px Consolas,monospace;color:#6366f1}.domain h3{margin:12px 0 8px;font-size:16px}.domain p{font-size:12px;color:#6b7b91;line-height:1.7;margin:0}.domain small{display:block;color:#6366f1;margin-top:12px;font-size:11px}.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;padding:20px;background:#eef2ff;border:1px solid #e0e7ff;border-radius:10px}.step{background:white;border:1px solid #dce2f5;border-radius:7px;flex:1;min-width:130px;padding:13px;font-size:12px;line-height:1.6}.step b{display:block;font:11px Consolas,monospace;color:#6366f1;margin-bottom:5px}.arrow{align-self:center;color:#94a3b8}.panel{background:white;border:1px solid #e0e6ef;border-radius:10px;padding:20px;margin-top:14px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f5;vertical-align:top;line-height:1.65}th{background:#f8fafc;color:#6b7b91;font-weight:500;white-space:nowrap}td small{display:block;color:#7d8ba0;font-size:10px;overflow-wrap:anywhere}code{font:11px Consolas,monospace;overflow-wrap:anywhere}.notice{padding:12px 16px;border-left:3px solid #818cf8;background:#eef2ff;font-size:12px;line-height:1.8;color:#53617b;margin:16px 0}.folder{margin:12px 0;border:1px solid #e2e8f0;border-radius:8px;background:white;padding:14px}.folder summary{cursor:pointer;font-size:12px;line-height:1.8}.folder summary code{display:block;color:#73839b}.files{max-height:340px;overflow:auto;margin-top:12px;border-top:1px solid #edf0f5;padding-top:8px}.files a{display:block;font:11px/2 Consolas,monospace;overflow-wrap:anywhere}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font:11px Consolas,monospace;border:1px solid #dde3ef;border-radius:5px;padding:7px 10px;background:white}.source{font-size:11px;color:#7d8ba0;line-height:1.8}.highlight{background:#eef2ff}.empty{color:#aab9d0;font-size:12px;padding:10px}.print{background:white;border:1px solid #dce1ea;border-radius:7px;padding:9px 13px;color:#4f46e5;font-size:12px}@media(max-width:1150px){aside{width:260px}main{padding:24px}.overview-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){aside{width:205px;padding:12px 8px}main{padding:18px}.overview-grid,.summary-grid{grid-template-columns:1fr}header{padding:12px;height:auto;min-height:76px}header strong{font-size:15px}h1{font-size:23px}.domain{min-height:0}}@media print{aside,header{display:none}.layout,main{display:block;height:auto;overflow:visible}main{padding:0}.panel,.domain,.flow{break-inside:avoid}.files{max-height:none}}
</style></head><body><header><div><strong>Fulfillment / 업무별 시스템 구성도</strong><small>BUSINESS ARCHITECTURE · PROJECT DIRECTORY MAP</small></div><div><a href="erd.html">전체 ERD 열기 ↗</a> <button class="print" onclick="window.print()">현재 분류 인쇄</button></div></header><div class="layout"><aside><div class="caption">BUSINESS EXPLORER</div><input id="search" type="search" aria-label="업무와 화면 검색" placeholder="업무 · 화면 · 경로 검색"><nav id="tree" aria-label="업무분류 폴더 트리"></nav><div class="side-note">01–08은 이 구성도의 업무 탐색 순서입니다. 프로그램 ID와 개발 차수는 원본 문서 값을 별도로 표시합니다.<br><br>실제 프로젝트 폴더를 업무 관점으로 묶어 보여줍니다. 파일 링크는 이 HTML의 상대 위치를 기준으로 열립니다.</div></aside><main id="content"></main></div>
<script id="map-data" type="application/json">/*__DATA__*/</script><script>
const D=JSON.parse(document.getElementById('map-data').textContent),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current='overview',screen='';
const fileLink=(p,label)=>`<a href="../${encodeURI(p)}">${esc(label||p)}</a>`;
const flow=items=>`<div class="flow">${items.map((s,i)=>`${i?'<span class="arrow">→</span>':''}<div class="step"><b>${String(i+1).padStart(2,'0')}</b>${esc(s)}</div>`).join('')}</div>`;
function tree(){const q=$('search').value.trim().toLowerCase();let html=`<button class="nav-button ${current==='overview'?'active':''}" data-group="overview"><span class="nav-number">00</span>시스템 전체 구성</button>`;let count=0;for(const g of D.groups){const own=(g.name+' '+g.id).toLowerCase().includes(q),routes=g.routes.filter(r=>own||[r.title,r.route,r.file].join(' ').toLowerCase().includes(q));if(q&&!own&&!routes.length)continue;count++;html+=`<details class="tree-group" ${q||current===g.id?'open':''}><summary><button class="nav-button ${current===g.id?'active':''}" data-group="${g.id}"><span class="nav-number">${g.number}</span>▱ ${esc(g.name)}</button></summary><button class="nav-button screen-link" data-group="${g.id}">분류 개요 · 폴더 구조</button>${routes.map(r=>`<button class="nav-button screen-link" data-group="${g.id}" data-screen="${esc(r.route)}"><span class="nav-number">${r.number}</span>${esc(r.title)}</button>`).join('')}${!g.routes.length?'<span class="nav-button screen-link"><small>문서 · 공통 구성</small></span>':''}</details>`;}if(!count)html+='<p class="empty">검색 결과가 없습니다.</p>';$('tree').innerHTML=html;}
function movementTable(rows){return `<div class="table-wrap"><table><thead><tr><th>이동유형</th><th>발생 원천 화면</th><th>실제 반영 시점</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r[0])}<small>${esc(r[1])}</small></td><td><a href="#${r[4]}" data-group="${r[4]}">${esc(r[2])}</a></td><td>${esc(r[3])}</td></tr>`).join('')}</tbody></table></div>`}
function overview(){return `<div class="eyebrow">00 / SYSTEM OVERVIEW</div><h1>업무 흐름으로 보는 시스템</h1><p class="lead">왼쪽 폴더에서 업무분류와 화면을 선택하면 소스 위치, 화면 경로, 관련 테이블과 프로그램 순서를 확인할 수 있습니다. 실제 라우트가 있는 화면과 요구사항 문서에만 있는 프로그램을 구분합니다.</p><div class="summary-grid">${[[8,'구성도 업무분류'],[D.routeCount,'라우트로 확인한 화면'],[D.programs.length,'문서 프로그램 · 취소 포함'],[47,'마이그레이션 테이블']].map(([n,l])=>`<div class="metric"><b>${n}</b><span>${l}</span></div>`).join('')}</div>${flow(['01 인증 · 02 시스템 설정','03 기준정보 준비','04 구매 · 발주','05 입고 · 검수 · 적치','06 재고 운영'])}<p class="source">대표 업무 흐름입니다. 기준정보의 독립 설정이나 재고 조회처럼 모든 단계를 순차 실행하지 않는 업무도 있습니다. 후속 업무는 07, 공통 기술은 08에서 확인합니다.</p><div class="overview-grid">${D.groups.map(g=>`<button class="domain" data-group="${g.id}"><span class="num">${g.number} / ${g.id.toUpperCase()}</span><h3>${esc(g.name)}</h3><p>${esc(g.desc)}</p><small>${g.routes.length?g.routes.length+'개 화면 · ':''}${g.programs.length?g.programs.length+'개 문서 프로그램':'공통 구성 참조'}</small></button>`).join('')}</div><h2>재고 이력의 발생 원천</h2><div class="panel">${movementTable(D.movements)}<p class="source">반품입고를 입고완료하는 현재 경로는 RECEIVE로 기록됩니다. 요청 저장과 승인·완료에 의한 원장 반영을 구분합니다.</p></div><h2>화면에서 데이터까지</h2>${flow(['Vue / modules','frontend/src/api','Controller → Service','DAO → mapper XML','PostgreSQL / Flyway'])}<p class="source">참조: ${fileLink('docs/PROGRAMS.md','프로그램 목록')} · ${fileLink('docs/REQUIREMENTS.md','요구사항')} · <a href="erd.html">전체 테이블 ERD</a><br>화면 수는 소스 라우트 기준이며 운영 배포나 실제 DB 적용 완료를 의미하지 않습니다.</p>`}
function detail(g){const related=D.movements.filter(r=>r[4]===g.id);return `<div class="eyebrow">${g.number} / ${g.id.toUpperCase()}</div><h1>${esc(g.name)}</h1><p class="lead">${esc(g.desc)}</p><div class="badges"><span class="badge">${g.routes.length}개 실제 라우트</span><span class="badge gray">${g.programs.length}개 문서 프로그램</span><span class="badge gray">구성도 ${g.number}번</span></div><h2>업무 구성 순서</h2>${flow(g.flow)}${g.id==='planned'?'<div class="notice">아래 항목은 프로그램 목록 문서 기준입니다. 이 저장소에서 해당 업무의 프론트엔드 모듈은 확인되지 않았습니다. 문서의 진행상태를 구현 완료로 해석하지 마세요.</div>':''}${g.routes.length?`<h2>화면 구성 · ${g.routes.length}</h2><p class="source">${g.number}.xx는 분류 내 라우트 선언 순서입니다. 실제 업무 처리 순서는 위 흐름을 참고하세요.</p><div class="panel table-wrap"><table><thead><tr><th>구성번호</th><th>화면명 / 권한</th><th>화면 경로</th><th>소스 파일</th></tr></thead><tbody>${g.routes.map(r=>`<tr id="screen-${r.number}" class="${r.route===screen?'highlight':''}"><td>${r.number}</td><td><b>${esc(r.title)}</b><small>${esc(r.permission||'라우트 개별 권한 지정 없음')}</small></td><td><code>${esc(r.route)}</code></td><td>${fileLink(r.file,r.file.split('/').at(-1))}</td></tr>`).join('')}</tbody></table></div>`:''}<h2>업무별 실제 폴더 구조</h2>${g.folders.map(f=>`<details class="folder"><summary>▱ ${esc(f.label)} · ${f.files.length}개 파일<code>${esc(f.path)}/</code></summary><div class="files">${f.files.map(p=>fileLink(p,p.slice(f.path.length+1))).join('')}</div></details>`).join('')||'<p class="source">현재 해당 업무 모듈 폴더 없음 · docs/PROGRAMS.md 참조</p>'}${g.tables.length?`<h2>관련 테이블</h2><div class="chips">${g.tables.map(t=>`<span class="chip">${t}</span>`).join('')}</div><p class="source">업무 관점의 관련 테이블이며 소유권·FK 관계를 뜻하지 않습니다. 공통 테이블은 여러 업무에서 사용됩니다. <a href="erd.html">ERD 열기 ↗</a></p>`:''}${related.length?`<h2>이 업무에서 발생하는 재고 이력</h2><div class="panel">${movementTable(related)}</div>`:''}${g.id==='shared'?`<div class="notice">백엔드의 domain은 공통 데이터 모델, common은 보안·코드·문서번호·업로드 등 공통 지원 기능입니다. 인증은 별도의 백엔드 auth 폴더가 아니라 system과 공통 지원 코드에 걸쳐 구현되어 있습니다.</div>`:''}${g.programs.length?`<h2>원본 프로그램 구성 순서</h2><p class="source">번호·ID·개발 차수·선행 프로그램·상태는 docs/PROGRAMS.md에 기재된 값입니다. 위 화면 목록과 일대일 대응하지 않습니다.</p><div class="panel table-wrap"><table><thead><tr><th>원본 순번 / ID</th><th>프로그램 / 업무영역</th><th>개발 차수</th><th>선행 프로그램</th><th>문서 상태</th></tr></thead><tbody>${g.programs.map(p=>`<tr><td>${esc(p.order)}<small>${esc(p.id)}</small></td><td><b>${esc(p.name)}</b><small>${esc(p.area+' · '+p.description)}</small></td><td>${esc(p.phase)}</td><td><code>${esc(p.before)}</code></td><td>${esc(p.status)}</td></tr>`).join('')}</tbody></table></div>`:''}<p class="source">관련 원본: ${fileLink('docs/PROGRAMS.md','프로그램 목록')} · ${fileLink('docs/REQUIREMENTS.md','요구사항')}</p>`}
function show(id,route=''){current=D.groups.some(g=>g.id===id)?id:'overview';screen=route;$('content').innerHTML=current==='overview'?overview():detail(D.groups.find(g=>g.id===current));tree();$('content').scrollTop=0;if(route){const g=D.groups.find(g=>g.id===current),r=g.routes.find(r=>r.route===route);if(r)document.getElementById('screen-'+r.number)?.scrollIntoView({block:'center'});}history.replaceState(null,'','#'+current);}
document.addEventListener('click',e=>{const el=e.target.closest('[data-group]');if(el){e.preventDefault();show(el.dataset.group,el.dataset.screen||'')}});$('search').addEventListener('input',tree);window.addEventListener('hashchange',()=>show(location.hash.slice(1)));show(location.hash.slice(1));
</script></body></html>
